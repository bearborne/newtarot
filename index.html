<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bearcana</title>

  <!-- Makes it open full screen, like an app, from the iPhone Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bearcana">
  <meta name="theme-color" content="#15131c">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-512.png">
  <link rel="manifest" href="manifest.json">

  <!-- Literata: a serif made for reading on screens, used for the summary text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Literata:opsz,wght@7..72,400;7..72,500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1. Choose a spread -->
  <section class="screen" id="home">
    <canvas class="sky" id="sky" aria-hidden="true"></canvas>
    <header class="home-head">
      <h1>Bearcana</h1>
    </header>
    <div class="float-deck" id="floatDeck"></div>
    <button class="cotd" id="cotd">Reveal card of the day</button>
    <p class="home-sub">Choose a spread</p>
    <div class="spread-list" id="spreadList"></div>
    <div class="home-links">
      <button class="pill" id="browseBtn">Browse the cards</button>
      <button class="pill" id="historyBtn">Your history</button>
    </div>
    <button class="cotd sky-link" id="skyBtn">✦ Sky now</button>
    <div class="options" id="options"></div>
  </section>

  <!-- 2. The table: shuffle, pick, turn -->
  <section class="screen" id="table" hidden>
    <canvas class="magic" id="magic" aria-hidden="true"></canvas>
    <canvas class="magic frames" id="frames" aria-hidden="true"></canvas>
    <header class="bar">
      <button class="link" id="backBtn">‹ Spreads</button>
      <span id="spreadName"></span>
      <span class="bar-space"></span>
    </header>
    <div class="slots-wrap"><div class="slots" id="slots"></div></div>
    <p class="hint" id="hint"></p>
    <div class="deck-area" id="deckArea">
      <div class="deck" id="deck" role="button" aria-label="Spread the cards"></div>
      <div class="fan" id="fan"></div>
      <div class="end-actions" id="endActions" hidden>
        <button class="pill summary-btn" id="summaryBtn">✦ Reading summary</button>
        <button class="pill" id="newBtn">New reading</button>
      </div>
    </div>
  </section>

  <!-- 3. The card window -->
  <div class="overlay" id="quick" hidden>
    <div class="quick-box" id="quickBox">
      <div class="quick-card" id="quickCard"></div>
      <p class="pos-label" id="quickPos"></p>
      <p class="pos-question" id="quickQuestion"></p>
      <h2 id="quickName"></h2>
      <p class="reversed-note" id="quickReversed" hidden>Reversed</p>
      <div class="tags" id="quickTags"></div>
      <p class="keywords" id="quickKeywords"></p>
      <div class="quick-text" id="quickText"></div>
      <div class="asks" id="quickAsks"></div>
      <button class="pill" id="moreBtn">More about this card</button>
      <button class="link" id="quickClose">Close</button>
    </div>
  </div>

  <!-- 4. The details window is built by app.js each time it opens -->

  <!-- 5. Browse the cards -->
  <div class="sheet" id="browse" hidden>
    <header class="bar">
      <button class="link" id="browseBack">‹ Back</button>
      <span class="bar-title">The cards</span>
      <span class="bar-space"></span>
    </header>
    <div class="browse-body">
      <div class="tag-head" id="tagHead" hidden>
        <div id="tagHeadBox"></div>
        <div id="tagHeadMeaning"></div>
        <button class="link" id="tagClear">Show all cards</button>
      </div>
      <div id="browseFilters">
        <div class="chips" id="suitChips"></div>
        <div class="tags all-tags" id="allTags"></div>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </div>

  <!-- 6. Your history: past readings, and backups -->
  <div class="sheet" id="history" hidden>
    <header class="bar">
      <button class="link" id="historyBack">‹ Back</button>
      <span class="bar-title">Your history</span>
      <span class="bar-space"></span>
    </header>
    <div class="history-body">
      <p class="history-note">Your readings and notes are saved on this device only.
        Export a backup to keep them safe, or import one on another phone or computer.</p>
      <div class="history-actions">
        <button class="pill small" id="exportBtn">Export backup</button>
        <button class="pill small" id="importBtn">Import backup</button>
        <input type="file" id="importFile" accept=".json,application/json" hidden>
      </div>
      <div id="historyList"></div>
    </div>
  </div>

  <!-- 7. Sky now: the planets this moment -->
  <div class="sheet" id="skySheet" hidden>
    <header class="bar">
      <button class="link" id="skyBack">‹ Back</button>
      <span class="bar-title">Sky now</span>
      <span class="bar-space"></span>
    </header>
    <div class="history-body sky-body" id="skyBody"></div>
  </div>

  <!-- The little window a golden tag opens -->
  <div class="tag-tip" id="tagTip" hidden></div>

  <script src="cards.js"></script>
  <script src="tags.js"></script>
  <script src="symbols.js"></script>
  <script src="spreads.js"></script>
  <script src="pickfx.js"></script>
  <script src="astronomy.js"></script>
  <script src="app.js"></script>
</body>
</html>
