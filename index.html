<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tarot</title>

  <!-- Makes it open full screen, like an app, from the iPhone Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tarot">
  <meta name="theme-color" content="#15131c">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-512.png">
  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <button class="card" id="card" aria-label="Draw a card">
      <div class="card-inner">
        <!-- Back of the card -->
        <div class="face back">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <circle cx="50" cy="50" r="30" fill="none" stroke="currentColor" stroke-width="1"/>
            <circle cx="50" cy="50" r="36" fill="none" stroke="currentColor" stroke-width="0.5" stroke-dasharray="1 3"/>
            <path d="M58 32 A20 20 0 1 0 58 68 A16 16 0 1 1 58 32 Z" fill="currentColor"/>
            <g fill="currentColor">
              <circle cx="50" cy="8" r="1.4"/><circle cx="50" cy="92" r="1.4"/>
              <circle cx="8" cy="50" r="1.4"/><circle cx="92" cy="50" r="1.4"/>
            </g>
          </svg>
        </div>
        <!-- Front of the card (filled in when drawn) -->
        <div class="face front" id="front"></div>
      </div>
    </button>

    <p class="hint" id="hint">Tap the card to draw</p>

    <section class="reading" id="reading" aria-live="polite">
      <h1 id="name"></h1>
      <div id="text"></div>
      <button class="again" id="again">Draw again</button>
    </section>
  </main>

  <script src="cards.js"></script>
  <script src="app.js"></script>
</body>
</html>
